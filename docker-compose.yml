version: "3.9"

# FloodGuard — ambiente de desenvolvimento local (F1).
# Sem Dockerfiles próprios ainda: api e web rodam com imagens genéricas,
# instalando dependências no start e montando o código como volume.

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: floodguard-postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - floodguard_pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    container_name: floodguard-api
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SIMULATION_MODE: ${SIMULATION_MODE}
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      postgis:
        condition: service_healthy
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:20-slim
    container_name: floodguard-web
    working_dir: /app
    env_file:
      - .env
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./apps/web:/app
      - floodguard_web_node_modules:/app/node_modules
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  floodguard_pgdata:
  floodguard_web_node_modules:
